name: design-system-gate

on:
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Gate added lines
        shell: bash
        run: |
          #
          # Design-system gate, scoped to ADDED LINES.
          #
          # Why this changed (DR1):
          #   The previous gate checked whole changed FILES. That meant any cross-cutting
          #   refactor inherited every pre-existing violation in every file it touched.
          #   DR1 deletes a <UniversalComposer> mount from 15 legacy files and adds not
          #   one violating line to them, and the gate failed on 121 lines of unrelated
          #   pre-existing debt.
          #
          #   The stated purpose of this gate is to stop NEW violations without requiring
          #   a burndown. Whole-file scoping is a burndown requirement wearing a
          #   no-burndown gate's clothing, and it gets worse as consolidation work touches
          #   more files.
          #
          #   Scoping to added lines keeps every tooth that matters: a newly written
          #   violating line still fails, on any file, new or legacy.
          #
          # Known limitation, accepted deliberately:
          #   A pre-existing violation that is MOVED or reindented reads as an added line
          #   and will now fail. That is the safe direction. A pre-existing violation left
          #   untouched will not be caught, which is the whole point.
          #

          # NO errexit, deliberately and explicitly.
          #
          # GitHub injects -e into `shell: bash`, and a grep that legitimately returns 1
          # ("ran, found nothing") is a PASS here, not an error. Under errexit that pass
          # kills the step silently. The first draft of this script toggled `set +e` /
          # `set -e` around each check, which turned errexit ON globally after the first
          # check and made the script behave differently locally than in CI — it exited
          # mid-run with no error printed, and a gate that dies silently is indisputably
          # worse than one that fails.
          #
          # So: errexit off, every return code checked explicitly, every failure an
          # explicit `exit 1`. Fail-closed is preserved by handling rc > 1 as a failure,
          # not by relying on the shell's ambient mode.
          set +e
          set -uo pipefail

          BASE_REF="${{ github.base_ref }}"
          git fetch --no-tags origin "$BASE_REF"
          BASE="origin/$BASE_REF"

          # Added lines only, as "path:newlineno:content".
          # -U0 means no context lines, so only '+' lines advance the new-file counter.
          ADDED="$(
            git diff -U0 --diff-filter=d "$BASE"...HEAD -- 'src/*.ts' 'src/*.tsx' | awk '
              /^\+\+\+ b\// { file = substr($0, 7); next }
              /^\+\+\+ \/dev\/null/ { file = ""; next }
              /^@@/ {
                # @@ -a,b +c,d @@   ->  c
                match($0, /\+[0-9]+/)
                n = substr($0, RSTART + 1, RLENGTH - 1) + 0
                next
              }
              /^\+/ { if (file != "") { print file ":" n ":" substr($0, 2) } ; n++ ; next }
            '
          )"
          DIFF_RC=$?
          if [ "$DIFF_RC" -ne 0 ]; then
            echo "::error::git diff failed (exit $DIFF_RC). Failing closed."
            exit 1
          fi

          if [ -z "$ADDED" ]; then
            echo "No added src TS lines. Gate passes trivially."
            exit 0
          fi

          echo "Gating $(printf '%s\n' "$ADDED" | wc -l) added line(s) across \
          $(printf '%s\n' "$ADDED" | cut -d: -f1 | sort -u | wc -l) file(s)."

          FAILED=0

          # grep rc 0 = matched (FAIL). rc 1 = ran, no match (PASS).
          # rc > 1 = errored, and an errored guard is a FAILED guard, never a pass.
          check () {
            local label="$1"; shift
            local pattern="$1"; shift
            local out rc
            out="$(printf '%s\n' "$ADDED" | grep -nE "$pattern")"
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "::error::${label}"
              printf '%s\n' "$out"
              FAILED=1
            elif [ "$rc" -gt 1 ]; then
              echo "::error::grep errored (exit $rc) on check: ${label}. Failing closed."
              FAILED=1
            fi
          }

          check "Hex color literal. Use a semantic token." \
                '#[0-9a-fA-F]{3,8}\b'

          # Functional colour notation (BD328). The hex check above cannot see
          # these: 'hsl(153 40% 30%)' contains no #. This is precisely the form
          # that let src/components/feed/cards/FeedCardBase.tsx accumulate ten
          # hardcoded C values as an object literal, which is what actually
          # paints every card bevel in the product.
          #
          # The hsl(var(--token)) escape is allowed and must stay allowed: that
          # is the correct way to consume a token. Only LITERAL channel values
          # fire, which is what the digit-anchored first argument enforces.
          check "Functional colour literal. Use hsl(var(--c5-<c>-bevel)) or hsl(var(--c5-<c>-text)), never literal channels." \
                '\b(hsl|hsla|rgb|rgba|oklch|lab)\(\s*[0-9.]'

          check "Banned Tailwind default font size. Use the DNA scale: micro meta body h3 h2 h1 display hero." \
                '\btext-(xs|sm|base|lg|xl|2xl|3xl|4xl|5xl|6xl|7xl|8xl|9xl)\b'

          check "Legacy font alias. Use font-display or font-body." \
                '\bfont-(sans|ui|serif|heritage)\b'

          # Raw Tailwind palette (BD291). The gate has never matched these, so
          # 2,977 sites merged freely while BD289 described them as "the half the
          # gate exists to prevent." Added-lines scoped like every other check, so
          # this costs no burndown and blocks new violations from this merge on.
          #
          # Shape-anchored deliberately: utility-palette-NUMBER. That is what keeps
          # dna-emerald, dna-stone and dna-sand out (the dna- segment breaks the
          # shape) and what keeps file paths out (shared/ contains "red", but
          # carries no numeric suffix). Prose is unaffected: "status GREEN, a red
          # flag" does not fire.
          check "Raw Tailwind palette colour (BD291). Use a token: c5-connect|convene|collaborate|contribute|convey for Five C's surfaces, dna-* for brand, or the semantic set (primary, muted, destructive, accent, border, foreground)." \
                '\b(!)?(text|bg|border|border-[trblxy]|from|via|to|ring|ring-offset|fill|stroke|shadow|divide|outline|decoration|accent|caret|placeholder)-(slate|gray|grey|zinc|neutral|stone|red|orange|amber|yellow|lime|green|emerald|teal|cyan|sky|blue|indigo|violet|purple|fuchsia|pink|rose)-(50|100|200|300|400|500|600|700|800|900|950)\b'

          # Arbitrary values, with the hsl(var(--x)) escape allowed.
          ARB='\b(text|bg|p|px|py|pt|pb|pl|pr|m|mx|my|mt|mb|ml|mr|w|h|min-w|min-h|max-w|max-h|gap|top|left|right|bottom|rounded|border|leading|tracking)-\['
          raw="$(printf '%s\n' "$ADDED" | grep -E "$ARB")"
          rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::grep errored (exit $rc) on arbitrary-value check. Failing closed."
            FAILED=1
          elif [ "$rc" -eq 0 ]; then
            filtered="$(printf '%s\n' "$raw" | grep -v 'hsl(var(')"
            if [ -n "$filtered" ]; then
              echo "::error::Arbitrary Tailwind value. Only bg-[hsl(var(--token))] is permitted."
              printf '%s\n' "$filtered"
              FAILED=1
            fi
          fi

          # Page-level layout values, only for added lines under src/pages.
          PAGE_ADDED="$(printf '%s\n' "$ADDED" | grep '^src/pages/')"
          if [ -n "$PAGE_ADDED" ]; then
            out="$(printf '%s\n' "$PAGE_ADDED" | grep -E '\b(max-w-|container|px-|py-|mt-|mb-)')"
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "::error::Page-level layout value. Section owns rhythm, Container owns width."
              printf '%s\n' "$out"
              FAILED=1
            elif [ "$rc" -gt 1 ]; then
              echo "::error::grep errored (exit $rc) on page-layout check. Failing closed."
              FAILED=1
            fi
          fi

          # OS-framing tripwire (BD234). "operating system" is retired for DNA's
          # positioning with no legitimate use, so a plain case-insensitive string
          # match is safe here — unlike register terms ("the body"), which are
          # surface-dependent and would fire falsely on the Manifesto. This gates
          # ONLY the absolute OS ban, never register.
          #
          # The tripwire is absolute: no file is allowlisted. The Manifesto line
          # that once carried the OS framing has been retired, so the exception it
          # held is gone with it.
          #
          # rc handled explicitly like every other check above: no new set +e/-e
          # toggle is introduced (BD121), so the ambient errexit-off mode never
          # turns a legitimate rc-1 "no match" into a silent pass.
          if [ -n "$ADDED" ]; then
            out="$(printf '%s\n' "$ADDED" | grep -iE 'operating system')"
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "::error::Retired OS framing. 'operating system' is retired for DNA's positioning. Use the canonical line: 'DNA is the mobilization infrastructure for the Global African Diaspora'\''s return.'"
              printf '%s\n' "$out"
              FAILED=1
            elif [ "$rc" -gt 1 ]; then
              echo "::error::grep errored (exit $rc) on OS-framing check. Failing closed."
              FAILED=1
            fi
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "Design system gate FAILED."
            exit 1
          fi
          echo "Design system gate passed."

      - name: media-matrix
        shell: bash
        run: |
          #
          # media-matrix tripwire.
          #
          # A spine-owned picker surface must CONSUME the media matrix
          # (accept={ACCEPT.<surface>}) and never restate the type list inline.
          # A literal accept="..." here means a picker has re-hardcoded the MIME
          # list and will silently drift from what uploadMedia() actually accepts.
          # The only legal accept form in these directories is accept={ACCEPT.<surface>}.
          #
          # Scope, spine-owned surfaces only:
          #   - src/components/composer/fields/**
          #   - src/components/convey/editor/**
          # Only .tsx files are checked. This is a whole-file check, not added-lines:
          # a restated matrix is a defect no matter which commit last touched the line.
          #
          # errexit discipline (BD121): GitHub injects `set -e` into shell: bash.
          # rg exits 1 when it finds nothing, which is THIS gate's PASS, and under
          # errexit that legitimate rc=1 would kill the step. A *global* `set +e`
          # would fix that but turn every later unhandled error into a silent pass:
          # fail-closed becomes fail-open. So `set +e` is scoped to the single rg
          # check ONLY — captured rc, then `set -e` restored immediately. Every
          # other line keeps errexit, so a genuine error still aborts fail-closed.
          # The informational listings use `|| true` because "no files" there is not
          # a gate signal, just an empty scope report.

          COVERED='src/components/composer/fields/**/*.tsx, src/components/convey/editor/**/*.tsx'

          # State the scope on every run — green included — so a pass says what it
          # actually inspected and what it skipped.
          SCANNED="$(rg --files --glob '*.tsx' src/components/composer/fields src/components/convey/editor 2>/dev/null | sort || true)"
          EXCLUDED="$(rg --files --glob '!*.tsx' src/components/composer/fields src/components/convey/editor 2>/dev/null | sort || true)"

          echo "media-matrix scope covered: ${COVERED}"
          echo "Files scanned (.tsx in scope):"
          printf '%s\n' "${SCANNED:-(none)}" | sed 's/^/  /'
          echo "Files excluded (non-.tsx in scope):"
          printf '%s\n' "${EXCLUDED:-(none)}" | sed 's/^/  /'

          # The single check. rc 0 = literal accept string found (FAIL),
          # rc 1 = none found (PASS), rc >1 = rg errored (FAIL closed).
          # set +e scoped to this rg invocation ONLY.
          set +e
          HITS="$(rg -F 'accept="' --glob '*.tsx' src/components/composer/fields src/components/convey/editor)"
          RC=$?
          set -e

          if [ "$RC" -eq 0 ]; then
            echo "::error::media-matrix: literal accept string in a spine-owned surface. Consume the matrix — accept={ACCEPT.<surface>}, never accept=\"...\"."
            printf '%s\n' "$HITS"
            exit 1
          elif [ "$RC" -gt 1 ]; then
            echo "::error::media-matrix: rg errored (exit $RC). Failing closed."
            exit 1
          fi

          echo "media-matrix passed: no literal accept strings in scope."

      - name: D092 contrast invariants
        shell: bash
        run: node scripts/check-c5-contrast.mjs

  sw-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: sw.js changed implies CACHE_VERSION bumped
        shell: bash
        run: |
          set -uo pipefail

          BASE_REF="${{ github.base_ref }}"
          git fetch --no-tags origin "$BASE_REF"
          BASE="origin/$BASE_REF"

          if git diff --quiet "$BASE"...HEAD -- public/sw.js tailwind.config.ts src/index.css src/layouts/ src/components/shell/; then
            echo "No cache-relevant files changed. Gate passes."
            exit 0
          fi

          OLD="$(git show "$BASE":public/sw.js | grep -oE 'CACHE_VERSION *= *[0-9]+' | grep -oE '[0-9]+' || true)"
          NEW="$(grep -oE 'CACHE_VERSION *= *[0-9]+' public/sw.js | grep -oE '[0-9]+' || true)"

          echo "public/sw.js changed. CACHE_VERSION old='$OLD' new='$NEW'"

          if [ -z "$OLD" ] || [ -z "$NEW" ]; then
            echo "::error::Could not read CACHE_VERSION on one or both sides. Failing closed."
            exit 1
          fi

          if [ "$NEW" -le "$OLD" ]; then
            echo "::error::public/sw.js changed but CACHE_VERSION was not incremented. Returning users will serve stale assets from cache and never see this release."
            exit 1
          fi

          echo "sw version gate passed."
